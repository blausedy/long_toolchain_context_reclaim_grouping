[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blausedy-long_toolchain_context_reclaim_grouping"
version = "0.1.0"
description = "按结构键把条目聚类，标出NLP 算法工程师·长工具链的上下文回收上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "blausedy" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://blausedy.github.io"
Repository = "https://github.com/blausedy/long_toolchain_context_reclaim_grouping"
Issues = "https://github.com/blausedy/long_toolchain_context_reclaim_grouping/issues"

[project.scripts]
long_toolchain_context_reclaim_grouping = "long_toolchain_context_reclaim_grouping:main"

[tool.setuptools]
py-modules = ["long_toolchain_context_reclaim_grouping"]
